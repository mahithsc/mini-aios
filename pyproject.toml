[project]
name = "mini-aios"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.5.9",
    "anthropic>=0.52.0",
    "apscheduler>=3.11.2",
    "fastapi>=0.135.1",
    "openai>=2.26.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.42.0",
    "zeroconf>=0.148.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.22",
    "bless>=0.3.0",
    "bluez-peripheral>=0.1.7",
    "cryptography>=42.0.0",
]

[tool.uv]
# Only resolve for the platforms we actually run on (the Linux box + macOS dev).
# Avoids a Windows-only winrt dependency conflict pulled in by bless/bleak.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[tool.uv.workspace]
members = [
    "work/sonosctl",
]
