services:
  box:
    image: ${AIOS_IMAGE}
    ports:
      - "8765:8765"
    environment:
      AIOS_ENV: production
      AIOS_SERVER_HOST: 0.0.0.0
      AIOS_SERVER_PORT: 8765
      AIOS_CLOUD_URL: https://computer.trywink.io
      AIOS_RELEASE_ID: ${AIOS_RELEASE_ID}
      AIOS_VERSION: ${AIOS_VERSION}
      AIOS_RELEASE_SEQUENCE: ${AIOS_RELEASE_SEQUENCE}
      AIOS_IMAGE_DIGEST: ${AIOS_IMAGE_DIGEST}
      AIOS_REVISION: ${AIOS_REVISION}
      AIOS_DISABLE_MDNS: "0"
    volumes:
      - /var/lib/mini-aios:/root/.mini-aios
      - /etc/mini-aios/updater-admin-token:/run/secrets/aios-updater-token:ro
    restart: unless-stopped
