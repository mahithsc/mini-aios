services:
  box:
    image: ${AIOS_IMAGE}
    platform: __CONTAINER_PLATFORM__
    env_file:
      - __APP_ENV_FILE__
    ports:
      - "8765:8765"
    environment:
      AIOS_ENV: production
      AIOS_SERVER_HOST: 0.0.0.0
      AIOS_SERVER_PORT: 8765
      AIOS_RELEASE_ID: ${AIOS_RELEASE_ID}
      AIOS_VERSION: ${AIOS_VERSION}
      AIOS_RELEASE_SEQUENCE: ${AIOS_RELEASE_SEQUENCE}
      AIOS_IMAGE_DIGEST: ${AIOS_IMAGE_DIGEST}
      AIOS_REVISION: ${AIOS_REVISION}
      AIOS_DISABLE_MDNS: "1"
      AIOS_DISABLE_TUNNEL: "1"
    volumes:
      - __AIOS_DATA_DIR__:/root/.mini-aios
      - __UPDATER_TOKEN_FILE__:/run/secrets/aios-updater-token:ro
    restart: unless-stopped
